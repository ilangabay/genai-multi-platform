# Governance app + LiteLLM proxy + PostgreSQL. Before the first start (details in docs/aws-setup.md):
#   - .env next to this file: POSTGRES_PASSWORD, ADMIN_PASSWORD (12+ characters), LITELLM_MASTER_KEY, LITELLM_SALT_KEY,
#     BEDROCK_ROLE_ARN
#   - certs/gateway.crt and certs/gateway.key: the VM certificate for IAM Roles Anywhere
#   - litellm/aws-config: copied from litellm/aws-config.example, ARNs filled in
# Then: docker compose up --build
# Governance UI on http://localhost:8000 (sign in as admin with ADMIN_PASSWORD), LLM endpoint on http://localhost:4000/v1.
services:
  db:
    build: postgres
    image: genai-gateway-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # no published port: only the app and LiteLLM reach the database

  litellm:
    build: litellm
    image: genai-gateway-litellm
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY (sk- followed by a long random string) in .env}
      # models added from the Catalog page are kept in LiteLLM's database, their settings encrypted with this key
      STORE_MODEL_IN_DB: "True"
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env (never change it afterwards)}
      BEDROCK_REGION: ${BEDROCK_REGION:-eu-west-3}
      BEDROCK_ROLE_ARN: ${BEDROCK_ROLE_ARN:?set BEDROCK_ROLE_ARN in .env}
      ONPREM_API_BASE: ${ONPREM_API_BASE:-http://onprem-llm.internal:8000/v1}
      AWS_CONFIG_FILE: /aws/config
      AWS_REGION: ${BEDROCK_REGION:-eu-west-3}  # STS calls go to sts.<region>.amazonaws.com
    volumes:
      - ./litellm/aws-config:/aws/config:ro
      - ./certs:/certs:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      start_period: 90s  # database migrations on the first start
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: genai-gateway
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    environment:
      STORAGE: postgres
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (12+ characters) in .env}
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # what users put in their code: the LiteLLM address as they reach it
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://localhost:4000/v1}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DEFAULT_PROJECT_BUDGET: ${DEFAULT_PROJECT_BUDGET:-100}
      BEDROCK_REGION: ${BEDROCK_REGION:-eu-west-3}
      # Catalog page: Bedrock models added there use this role; prices come from PRICING_URL (needs egress to it)
      BEDROCK_ROLE_ARN: ${BEDROCK_ROLE_ARN}
      PRICING_URL: ${PRICING_URL:-https://pricing.us-east-1.amazonaws.com}
      PRICE_SYNC_HOURS: ${PRICE_SYNC_HOURS:-6}  # prices re-read from AWS this often, then given to LiteLLM
      ONPREM_API_BASE: ${ONPREM_API_BASE:-http://onprem-llm.internal:8000/v1}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
