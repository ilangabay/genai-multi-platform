# App + PostgreSQL. Set POSTGRES_PASSWORD and ADMIN_PASSWORD (12+ characters) in .env next to this file, then:
#   docker compose up --build
# Open http://localhost:8000 and sign in as admin with ADMIN_PASSWORD; you must change it at first sign-in.
services:
  db:
    build: postgres
    image: genai-gateway-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # no published port: only the app reaches the database

  app:
    build: .
    image: genai-gateway
    depends_on:
      db:
        condition: service_healthy
    environment:
      STORAGE: postgres
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD (12+ characters) in .env}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      DEFAULT_PROJECT_BUDGET: ${DEFAULT_PROJECT_BUDGET:-100}
      BEDROCK_REGION: ${BEDROCK_REGION:-eu-west-3}
      SYNC_PRICES: ${SYNC_PRICES:-0}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
