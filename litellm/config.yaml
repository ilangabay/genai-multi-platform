# LiteLLM proxy config (image: litellm/Dockerfile, service: compose.yaml).
#
# Only the on-prem defaults live here. Bedrock models are added from the governance app's Catalog page
# (LiteLLM /model/new, kept in LiteLLM's database): their prices come from the AWS price list and are re-synced every
# PRICE_SYNC_HOURS, which LiteLLM only allows for models stored in its database, not for models in this file.
# After the first start, add claude-opus-5-5, claude-sonnet-5-5 and claude-haiku-5-5 there (Add model > Look up > Add).
#
# AWS access of those models: LiteLLM calls STS AssumeRole into BEDROCK_ROLE_ARN, from the VM's own identity
# (IAM Roles Anywhere), see litellm/aws-config.example and docs/aws-setup.md.

model_list:
  # On-prem (OpenAI-compatible, e.g. vLLM): free, so calls never use budget. They fail until ONPREM_API_BASE answers.
  - model_name: mistral-small-onprem
    litellm_params:
      model: hosted_vllm/mistral-small
      api_base: os.environ/ONPREM_API_BASE
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info: {platform: On-prem}

  - model_name: llama-70b-onprem
    litellm_params:
      model: hosted_vllm/llama-3.3-70b
      api_base: os.environ/ONPREM_API_BASE
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info: {platform: On-prem}

litellm_settings:
  drop_params: true  # silently drop OpenAI parameters a provider does not support

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY  # admin key: the governance app uses it, never shown to users
