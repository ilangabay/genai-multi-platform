<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenAI Gateway</title>
<style>
  :root { --blue: #1d4ed8; --blue-soft: #eff4ff; --line: #e5e9f2; --text: #0f172a; --muted: #64748b; --red: #b91c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: #fff; }
  button, input, select { font: inherit; }
  button { border: 1px solid var(--blue); background: var(--blue); color: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.ghost { background: #fff; color: var(--blue); }
  button.danger { background: #fff; color: var(--red); border-color: var(--red); }
  input, select { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  code { font: 13px ui-monospace, Consolas, monospace; background: var(--blue-soft); padding: 3px 6px; border-radius: 4px; word-break: break-all; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .error { color: var(--red); }

  #login { min-height: 100vh; display: grid; place-items: center; background: var(--blue-soft); }
  #login form { background: #fff; padding: 32px; border-radius: 12px; width: 320px; display: grid; gap: 12px; box-shadow: 0 4px 24px #1d4ed814; }
  #login h1 { margin: 0 0 4px; font-size: 20px; color: var(--blue); }

  #app { display: flex; min-height: 100vh; }
  nav { width: 220px; flex-shrink: 0; background: var(--blue); color: #fff; display: flex; flex-direction: column; padding: 20px 12px; }
  nav .brand { font-weight: 600; font-size: 16px; padding: 0 10px 20px; }
  nav a { color: #dbe5ff; text-decoration: none; padding: 7px 10px; border-radius: 6px; display: block; }
  nav a:hover, nav a.active { background: #ffffff22; color: #fff; }
  nav .section { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a9bcf5; padding: 16px 10px 6px; }
  nav .foot { margin-top: auto; padding: 10px; font-size: 13px; color: #dbe5ff; }
  nav .foot button { margin-top: 8px; width: 100%; background: transparent; border-color: #ffffff55; }

  main { flex: 1; padding: 32px 40px; max-width: 900px; }
  h2 { margin: 0 0 4px; font-size: 22px; }
  h3 { margin: 0 0 12px; font-size: 14px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-top: 20px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .row .label { width: 80px; color: var(--muted); }
  .bar { height: 8px; background: var(--blue-soft); border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .bar div { height: 100%; background: var(--blue); }
  .bar.full div { background: var(--red); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  tr.click { cursor: pointer; } tr.click:hover { background: var(--blue-soft); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--blue-soft); color: var(--blue); }

  @media (max-width: 700px) { #app { flex-direction: column; } nav { width: auto; } main { padding: 20px 16px; } }
</style>
</head>
<body>

<div id="login" class="hidden">
  <form id="login-form">
    <h1>GenAI Gateway</h1>
    <span class="muted">Sign in to your projects</span>
    <input name="username" placeholder="Username" autocomplete="username" required aria-label="Username">
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
    <button>Sign in</button>
    <span id="login-error" class="error" role="alert"></span>
  </form>
</div>

<div id="app" class="hidden">
  <nav>
    <div class="brand">GenAI Gateway</div>
    <a href="#" data-view="overview">Overview</a>
    <div class="section">Projects</div>
    <div id="nav-projects"></div>
    <div class="foot"><div id="whoami"></div><button id="logout">Sign out</button></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd = n => '$' + Number(n).toFixed(n < 1 ? 4 : 2);
let me, projects = [], models = [], current = null, showKey = false;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || data.error?.message || r.statusText);
  return data;
}

async function boot() {
  try { me = await api('/api/me'); } catch { return showLogin(); }
  [projects, models] = await Promise.all([api('/api/projects'), api('/api/models')]);
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#whoami').textContent = `${me.username} · ${me.role}`;
  render();
}

function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }

$('#login-form').onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify(Object.fromEntries(f)) });
    $('#login-error').textContent = ''; e.target.reset(); boot();
  } catch (err) { $('#login-error').textContent = err.message; }
};
$('#logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); current = null; showLogin(); };
document.querySelector('nav').onclick = e => {
  const a = e.target.closest('a'); if (!a) return;
  e.preventDefault(); current = a.dataset.project || null; showKey = false; render();
};

async function refresh() { projects = await api('/api/projects'); render(); }

function render() {
  $('#nav-projects').innerHTML = projects.map(p =>
    `<a href="#" data-project="${esc(p.id)}" class="${p.id === current ? 'active' : ''}">${esc(p.name)}</a>`).join('');
  document.querySelector('[data-view=overview]').classList.toggle('active', !current);
  const p = projects.find(p => p.id === current);
  $('#main').innerHTML = p ? projectView(p) : overview();
  if (p) bindProject(p);
}

function bar(p) {
  const pct = p.budget ? Math.min(100, p.spent / p.budget * 100) : 100;
  return `<div class="bar ${pct >= 100 ? 'full' : ''}"><div style="width:${pct}%"></div></div>`;
}

function overview() {
  return `<h2>${me.role === 'admin' ? 'All projects' : 'My projects'}</h2>
    <p class="muted">${projects.length} project${projects.length === 1 ? '' : 's'}</p>
    <div class="card"><table>
      <tr><th>Project</th><th>Owner</th><th>Spent</th><th>Budget</th><th style="width:30%">Usage</th></tr>
      ${projects.map(p => `<tr class="click" data-open="${esc(p.id)}">
        <td>${esc(p.name)}</td><td>${esc(p.owner)}</td><td>${usd(p.spent)}</td><td>${usd(p.budget)}</td><td>${bar(p)}</td></tr>`).join('')}
    </table></div>`;
}

$('#main').addEventListener('click', e => {
  const row = e.target.closest('[data-open]');
  if (row) { current = row.dataset.open; render(); }
});

function projectView(p) {
  const admin = me.role === 'admin';
  const left = Math.max(0, p.budget - p.spent);
  const key = p.api_key ? (showKey ? p.api_key : p.api_key.slice(0, 8) + '•'.repeat(16)) : null;
  return `<h2>${esc(p.name)}</h2>
    <span class="muted">Owner ${esc(p.owner)}${p.members.length ? ' · Members ' + p.members.map(esc).join(', ') : ''}</span>

    <div class="card"><h3>Budget</h3>
      <div><strong>${usd(p.spent)}</strong> <span class="muted">used of ${usd(p.budget)} · ${usd(left)} left</span></div>
      ${bar(p)}
      ${admin ? `<div class="row" style="margin-top:12px"><label for="budget" class="label">Budget $</label>
        <input id="budget" type="number" min="0" step="0.01" value="${p.budget}" style="width:140px">
        <button id="save-budget">Save</button></div>` : ''}
    </div>

    <div class="card"><h3>Access</h3>
      <div class="row"><span class="label">Endpoint</span><code>${esc(p.endpoint)}</code>
        <button class="ghost" data-copy="${esc(p.endpoint)}">Copy</button></div>
      <div class="row"><span class="label">API key</span>
        ${key ? `<code>${esc(key)}</code>
          <button class="ghost" id="toggle-key">${showKey ? 'Hide' : 'Show'}</button>
          <button class="ghost" data-copy="${esc(p.api_key)}">Copy</button>`
              : '<span class="error">Revoked</span>'}</div>
      ${admin ? `<div class="row" style="margin-top:12px">
        ${p.api_key ? '<button class="danger" id="revoke">Revoke key</button>' : ''}
        <button class="ghost" id="regen">${p.api_key ? 'Regenerate key' : 'Create new key'}</button></div>` : ''}
    </div>

    <div class="card"><h3>Models</h3>
      <table><tr><th>Model</th><th>Platform</th><th>Input / 1M tok</th><th>Output / 1M tok</th></tr>
      ${models.map(m => `<tr><td><code>${esc(m.id)}</code></td><td><span class="pill">${esc(m.platform)}</span></td>
        <td>$${m.input.toFixed(2)}</td><td>$${m.output.toFixed(2)}</td></tr>`).join('')}</table>
    </div>

    <div class="card"><h3>Test call</h3>
      <div class="row">
        <select id="test-model" aria-label="Model">${models.map(m => `<option>${esc(m.id)}</option>`).join('')}</select>
        <button id="test">Send mock request</button>
      </div>
      <div id="test-result" role="status"></div>
    </div>`;
}

function bindProject(p) {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy));
  on('toggle-key', () => { showKey = !showKey; render(); });
  on('save-budget', async () => {
    await api(`/api/projects/${p.id}/budget`, { method: 'PATCH', body: JSON.stringify({ budget: Number($('#budget').value) }) });
    refresh();
  });
  on('revoke', async () => {
    if (confirm('Revoke this API key? Calls using it will fail immediately.')) {
      await api(`/api/projects/${p.id}/key/revoke`, { method: 'POST' }); refresh();
    }
  });
  on('regen', async () => {
    if (!p.api_key || confirm('Regenerate the key? The current one stops working.')) {
      await api(`/api/projects/${p.id}/key/regenerate`, { method: 'POST' }); refresh();
    }
  });
  on('test', async () => {
    const out = $('#test-result');
    if (!p.api_key) { out.innerHTML = '<span class="error">No active API key.</span>'; return; }
    const r = await fetch(p.endpoint + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + p.api_key },
      body: JSON.stringify({ model: $('#test-model').value, messages: [{ role: 'user', content: 'Hello' }] }),
    });
    const d = await r.json();
    const model = $('#test-model').value;
    await refresh();
    $('#test-model').value = model;
    $('#test-result').innerHTML = r.ok
      ? `<span>${esc(d.choices[0].message.content)}</span><br><span class="muted">Cost ${usd(d.x_cost_usd)} · ${usd(d.x_budget_remaining_usd)} left</span>`
      : `<span class="error">${r.status} · ${esc(d.error.message)}</span>`;
  });
}

boot();
</script>
</body>
</html>
