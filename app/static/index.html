<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenAI Gateway</title>
<style>
  :root { --blue: #1d4ed8; --blue-soft: #eff4ff; --line: #e5e9f2; --text: #0f172a; --muted: #64748b; --red: #b91c1c; }
  * { box-sizing: border-box; }
  html { font-size: clamp(14px, 0.3vw + 10px, 16px); }
  body { margin: 0; font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: #fff; }
  button, input, select, textarea { font: inherit; }
  button { border: 1px solid var(--blue); background: var(--blue); color: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer;
           transition: background .15s, color .15s, transform .05s; }
  button:hover { background: #1e40af; }
  button:active { transform: translateY(1px); }
  button.ghost { background: #fff; color: var(--blue); }
  button.ghost:hover { background: var(--blue-soft); }
  button.danger { background: #fff; color: var(--red); border-color: var(--red); }
  button.danger:hover { background: #fef2f2; }
  button.link, button.link:hover { background: none; }
  button.done, button.done:hover { background: var(--blue-soft); color: var(--blue); border-color: var(--blue-soft); }
  button:disabled { opacity: .6; cursor: wait; }
  button.link { border: 0; background: none; color: var(--blue); padding: 0; }
  input, select, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  textarea { width: 100%; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  code { font: 13px ui-monospace, Consolas, monospace; background: var(--blue-soft); padding: 3px 6px; border-radius: 4px; word-break: break-all; }
  pre { font: 13px/1.5 ui-monospace, Consolas, monospace; background: var(--blue-soft); padding: 12px 14px; border-radius: 6px; overflow-x: auto; margin: 0; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .error { color: var(--red); }

  #login { min-height: 100vh; display: grid; place-items: center; background: var(--blue-soft); padding: 16px; }
  #login .box { background: #fff; padding: 32px; border-radius: 12px; width: 100%; max-width: 340px; display: grid; gap: 12px; box-shadow: 0 4px 24px #1d4ed814; }
  #login h1 { margin: 0; font-size: 20px; color: var(--blue); }
  #login form { display: grid; gap: 12px; }

  #app { display: flex; min-height: 100vh; }
  nav { width: 220px; flex-shrink: 0; background: var(--blue); color: #fff; display: flex; flex-direction: column; padding: 20px 12px; }
  nav .brand { font-weight: 600; font-size: 16px; padding: 0 10px 20px; }
  nav a { color: #dbe5ff; text-decoration: none; padding: 7px 10px; border-radius: 6px; display: block; }
  nav a:hover, nav a.active { background: #ffffff22; color: #fff; }
  nav .section { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a9bcf5; padding: 16px 10px 6px; }
  nav .foot { margin-top: auto; padding: 10px; font-size: 13px; color: #dbe5ff; }
  nav .foot button { margin-top: 8px; width: 100%; background: transparent; border-color: #ffffff55; }
  nav .foot button:hover { background: #ffffff22; }
  nav .foot .pw-link { padding: 6px 0 0; color: #dbe5ff; font-size: 13px; }
  nav .foot .pw-link:hover { background: none; text-decoration: underline; }
  #app.locked nav > a, #app.locked nav .section, #app.locked #nav-projects, #app.locked .pw-link { display: none; }
  .issued { border-color: var(--blue); background: var(--blue-soft); }

  main { flex: 1; padding: clamp(20px, 3vw, 40px); max-width: 1440px; min-width: 0; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 20px; margin-top: 20px; }
  .cols > .card { margin-top: 0; }
  h2 { margin: 0 0 4px; font-size: 22px; }
  h3 { margin: 0 0 12px; font-size: 14px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  h4 { margin: 24px 0 8px; font-size: 15px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-top: 20px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .row .label { width: 80px; color: var(--muted); }
  .bar { height: 8px; background: var(--blue-soft); border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .bar div { height: 100%; background: var(--blue); }
  .bar.full div { background: var(--red); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  tr.click { cursor: pointer; } tr.click:hover { background: var(--blue-soft); }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--blue-soft); color: var(--blue); white-space: nowrap; }
  .pill.approved { background: #ecfdf5; color: #047857; }
  .pill.rejected { background: #fef2f2; color: var(--red); }
  .badge { background: #fff; color: var(--blue); border-radius: 9px; font-size: 11px; font-weight: 600; padding: 1px 7px; margin-left: 6px; }
  .badge:empty { display: none; }
  .fb { padding: 10px 0; border-bottom: 1px solid var(--line); white-space: pre-wrap; }
  .fb:last-child { border-bottom: 0; }
  td .tools input { width: 160px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
  .kpis > .card { margin-top: 0; }
  .kpi .v { font-size: 28px; font-weight: 600; }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart svg:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .chart text { fill: #898781; font-size: 12px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; top: 8px; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px;
         padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px #0f172a1a; min-width: 180px; z-index: 2; }
  .tip .r { display: flex; align-items: center; gap: 8px; }
  .tip .r b { margin-left: auto; padding-left: 16px; font-variant-numeric: tabular-nums; }
  .key-line { width: 12px; height: 2px; border-radius: 1px; flex-shrink: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .legend b { color: var(--text); font-weight: 500; margin-left: 4px; }
  details.tbl { border: 0; margin-top: 6px; }
  details.tbl summary { padding: 6px 0; font-size: 13px; color: var(--muted); }
  details.tbl .wrap { max-height: 320px; overflow: auto; }
  details.tbl table { font-size: 13px; font-variant-numeric: tabular-nums; }
  details { border-bottom: 1px solid var(--line); }
  summary { display: flex; align-items: center; gap: 12px; padding: 10px 6px; cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; color: var(--muted); transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  summary .price { margin-left: auto; color: var(--muted); font-size: 13px; }
  details .sample { padding: 0 6px 14px; display: grid; gap: 8px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 16px 0 4px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted);
                 padding: 8px 14px; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
  .seg { display: inline-flex; }
  .seg button { padding: 3px 10px; font-size: 13px; border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 90px 1fr; gap: 10px 12px; align-items: center; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; }
  fieldset.pick { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px 12px; margin: 0 0 14px; }
  fieldset.pick legend { color: var(--muted); font-size: 13px; padding: 0 6px; }
  .docs { max-width: 820px; }

  @media (max-width: 700px) { #app { flex-direction: column; } nav { width: auto; } main { padding: 20px 16px; } summary .price { display: none; } }
</style>
</head>
<body>

<div id="login" class="hidden">
  <div class="box">
    <h1>GenAI Gateway</h1>
    <div id="pick-role" style="display:grid;gap:10px">
      <span class="muted">Choose how to sign in</span>
      <button data-role="user">Sign in as user</button>
      <button data-role="admin" class="ghost">Sign in as admin</button>
    </div>
    <form id="login-form" class="hidden">
      <span id="login-title" class="muted"></span>
      <input name="username" placeholder="Username" autocomplete="username" aria-label="Username">
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
      <button>Sign in</button>
      <button type="button" class="link" id="back">← Back</button>
      <span id="login-error" class="error" role="alert"></span>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <nav>
    <div class="brand">GenAI Gateway</div>
    <a href="#" data-view="overview">Overview</a>
    <a href="#" data-view="usage" class="hidden admin-only">Usage</a>
    <a href="#" data-view="users" class="hidden admin-only">Users</a>
    <div class="section">Projects</div>
    <div id="nav-projects"></div>
    <div class="section">Workspace</div>
    <a href="#" data-view="requests">Requests<span id="pending" class="badge"></span></a>
    <a href="#" data-view="feedback">Feedback</a>
    <a href="#" data-view="docs">Documentation</a>
    <div class="foot"><div id="whoami"></div><a href="#" data-view="password" class="pw-link">Change password</a>
      <button id="logout">Sign out</button></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// project pages live under their own prefix, so a project named "Users" or "Docs" cannot shadow a page
const pv = id => 'project:' + id;
const usd = n => '$' + Number(n).toFixed(n < 1 ? 4 : 2);
const per1M = n => '$' + n.toFixed(n && n < 0.1 ? 3 : 2);
const price = m => m.input || m.output
  ? `${per1M(m.input)} in${m.cached != null ? ` · ${per1M(m.cached)} cached` : ''} · ${per1M(m.output)} out / 1M tokens` : 'Free';
let me, cfg, projects = [], models = [], users = [], requests = [], feedback = [], view = 'overview', ptab = 'overview', showKey = false, creating = false,
    lang = 'curl', apiKind = 'chat', loginRole, reqDraft = { kind: 'project', project: '' };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : data.error?.message || r.statusText);
  return data;
}

// ---------- login ----------
async function boot() {
  try { me = await api('/api/me'); } catch { return showLogin(); }
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#whoami').textContent = `${me.username} · ${me.role}`;
  // a temporary password set by an admin must be replaced before anything else (the API enforces it too)
  $('#app').classList.toggle('locked', me.must_change_password);
  if (me.must_change_password) { view = 'password'; return render(); }
  [projects, models, cfg] = await Promise.all([api('/api/projects'), api('/api/models'), api('/api/config'), loadInbox(), loadUsage()]);
  users = me.role === 'admin' ? await api('/api/users') : [];
  document.querySelectorAll('.admin-only').forEach(a => a.classList.toggle('hidden', me.role !== 'admin'));
  render();
}

function showLogin() {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#pick-role').classList.remove('hidden'); $('#login-form').classList.add('hidden');
}

$('#pick-role').onclick = e => {
  const b = e.target.closest('[data-role]'); if (!b) return;
  loginRole = b.dataset.role;
  const user = loginRole === 'user', f = $('#login-form');
  $('#login-title').textContent = user ? 'Sign in as user' : 'Sign in as admin';
  f.username.required = true;
  $('#pick-role').classList.add('hidden'); f.classList.remove('hidden');
  f.username.focus();
};
$('#back').onclick = () => { $('#login-error').textContent = ''; showLogin(); };
$('#login-form').onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify({ role: loginRole, username: f.username.value, password: f.password.value }) });
    $('#login-error').textContent = ''; f.reset(); boot();
  } catch (err) { $('#login-error').textContent = err.message; }
};
$('#logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); view = 'overview'; showLogin(); };

// ---------- navigation ----------
document.querySelector('nav').onclick = async e => {
  const a = e.target.closest('a'); if (!a) return;
  e.preventDefault(); view = a.dataset.project ? pv(a.dataset.project) : a.dataset.view; ptab = 'overview'; showKey = false; creating = false; issued = null;
  await (view === 'requests' || view === 'feedback' ? loadInbox() : view === 'users' ? loadUsers() : view === 'password' ? null : loadUsage());
  render(); scrollTo(0, 0);
};
$('#main').addEventListener('click', async e => {
  const row = e.target.closest('[data-open]');
  if (row) { view = pv(row.dataset.open); ptab = 'overview'; await loadUsage(); render(); }
  const req = e.target.closest('[data-request]');
  if (req) { reqDraft = { kind: req.dataset.request, project: req.dataset.project || '' }; view = 'requests'; await loadInbox(); render(); scrollTo(0, 0); }
  const c = e.target.closest('[data-copy]');
  if (c) copy(c.dataset.copy).then(() => flash(c, 'Copied ✓'), () => flash(c, 'Copy failed'));
});

function copy(text) {
  // navigator.clipboard is missing on plain-HTTP intranet pages and can be denied by browser policy: fall back
  return navigator.clipboard ? navigator.clipboard.writeText(text).catch(() => legacyCopy(text)) : legacyCopy(text);
}

function legacyCopy(text) {
  const t = Object.assign(document.createElement('textarea'), { value: text });
  document.body.append(t); t.select();
  const ok = document.execCommand('copy'); t.remove();
  return ok ? Promise.resolve() : Promise.reject();
}

function flash(btn, label) {
  const old = btn.textContent;
  btn.textContent = label; btn.classList.add('done');
  setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1500);
}

async function refresh() { [projects] = await Promise.all([api('/api/projects'), loadUsage()]); render(); }
async function loadInbox() { [requests, feedback] = await Promise.all([api('/api/requests'), api('/api/feedback')]); }

function render() {
  $('#nav-projects').innerHTML = projects.map(p =>
    `<a href="#" data-project="${esc(p.id)}" class="${pv(p.id) === view ? 'active' : ''}">${esc(p.name)}</a>`).join('');
  document.querySelectorAll('[data-view]').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  $('#pending').textContent = me.role === 'admin' ? requests.filter(r => r.status === 'pending').length || '' : '';
  const p = projects.find(p => pv(p.id) === view);
  $('#main').innerHTML = p ? projectView(p) : view === 'docs' ? docsView() : view === 'requests' ? requestsView()
    : view === 'feedback' ? feedbackView() : view === 'password' ? passwordView() : me.role !== 'admin' ? overview()
    : view === 'usage' ? usageView() : view === 'users' ? usersView() : overview();
  bindCharts();
  if (p) bindProject(p);
  if (view === 'overview' && creating) bindCreate();
  if (view === 'requests') bindRequests();
  if (view === 'feedback') bindFeedback();
  if (view === 'users' && me.role === 'admin') bindUsers();
  if (view === 'password') bindPassword();
}

function bar(p) {
  const pct = p.budget ? Math.min(100, p.spent / p.budget * 100) : 100;
  return `<div class="bar ${pct >= 100 ? 'full' : ''}"><div style="width:${pct}%"></div></div>`;
}

// ---------- overview ----------
function overview() {
  const admin = me.role === 'admin';
  return `<div class="head"><h2>${admin ? 'All projects' : 'My projects'}</h2>
      ${admin ? (creating ? '' : '<button id="new-project">New project</button>') : '<button class="ghost" data-request="project">Request a project</button>'}</div>
    <p class="muted">${projects.length} project${projects.length === 1 ? '' : 's'}</p>
    ${creating ? createForm() : ''}
    <div class="card">${projects.length ? `<table>
      <tr><th>Project</th><th>Owners</th><th>Spent</th><th>Budget</th><th style="width:30%">Usage</th></tr>
      ${projects.map(p => `<tr class="click" data-open="${esc(p.id)}">
        <td>${esc(p.name)}</td><td>${p.owners.map(esc).join(', ')}</td><td>${usd(p.spent)}</td><td>${usd(p.budget)}</td><td>${bar(p)}</td></tr>`).join('')}
    </table>` : '<p class="muted" style="margin:0">No project yet. Request one to get an endpoint and an API key.</p>'}</div>

    <div class="card"><div class="head"><h3>Available models</h3>
        ${admin ? '' : '<button class="link" data-request="model">Request a model</button>'}</div>
      <table><tr><th>Model</th><th>Platform</th><th>Price</th></tr>
      ${models.map(m => `<tr><td><code>${esc(m.id)}</code></td><td><span class="pill">${esc(platform(m))}</span></td>
        <td class="muted">${price(m)}</td></tr>`).join('')}</table>
      <p class="muted" style="margin:12px 0 0">On-prem models are free. Sample requests for each model are on the project pages.</p></div>`;
}

const platform = m => m.platform === 'Bedrock' ? `Bedrock · ${cfg.bedrock_region}` : m.platform;

function createForm() {
  return `<form class="card" id="create-form"><h3>New project</h3>
    <div class="grid">
      <label for="np-name">Name</label><input id="np-name" name="name" required>
      <label for="np-owner">Owner</label><select id="np-owner" name="owner">${users.map(u => `<option>${esc(u.username)}</option>`).join('')}</select>
      <span>Members</span><div class="checks">${users.map(({ username: u }) =>
        `<label><input type="checkbox" name="members" value="${esc(u)}"> ${esc(u)}</label>`).join('')}</div>
      <label for="np-budget">Budget $</label><input id="np-budget" name="budget" type="number" min="0" step="0.01" value="${cfg.default_budget}" required style="width:140px">
    </div>
    <div class="row" style="margin:16px 0 0"><button>Create</button><button type="button" class="ghost" id="cancel-create">Cancel</button>
      <span id="create-error" class="error" role="alert"></span></div>
  </form>`;
}

function bindCreate() {
  const f = $('#create-form');
  f.name.focus();
  $('#cancel-create').onclick = () => { creating = false; render(); };
  f.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(f);
    try {
      const p = await api('/api/projects', { method: 'POST', body: JSON.stringify({
        name: fd.get('name'), owner: fd.get('owner'), members: fd.getAll('members'), budget: Number(fd.get('budget')) }) });
      creating = false; view = pv(p.id); refresh();
    } catch (err) { $('#create-error').textContent = err.message; }
  };
}

document.addEventListener('click', e => { if (e.target.id === 'new-project') { creating = true; render(); } });

// ---------- project ----------
function sample(endpoint, model, kind = apiKind, language = lang) {
  const chat = kind === 'chat';
  if (language === 'python') return `import os
from openai import OpenAI

client = OpenAI(base_url="${endpoint}", api_key=os.environ["GATEWAY_API_KEY"])
` + (chat ? `resp = client.chat.completions.create(
    model="${model}",
    messages=[{"role": "user", "content": "Hello"}],
)
print(resp.choices[0].message.content)` : `resp = client.responses.create(
    model="${model}",
    input="Hello",
)
print(resp.output_text)`);
  return `curl ${endpoint}/${chat ? 'chat/completions' : 'responses'} \\
  -H "Authorization: Bearer $GATEWAY_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{"model": "${model}", ${chat ? '"messages": [{"role": "user", "content": "Hello"}]' : '"input": "Hello"'}}'`;
}

const seg = (name, cur, opts) => `<div class="seg" role="group" aria-label="${name}">${opts.map(([v, l]) =>
  `<button type="button" class="${cur === v ? '' : 'ghost'}" data-${name}="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;

function projectView(p) {
  const admin = me.role === 'admin';
  const left = Math.max(0, p.budget - p.spent);
  const key = p.api_key ? (showKey ? p.api_key : p.api_key.slice(0, 8) + '•'.repeat(16)) : null;
  const tabs = [['overview', 'Overview'], ['models', 'Models'], ['members', 'Members']];
  return `<h2>${esc(p.name)}</h2>
    <span class="muted">Owners ${p.owners.map(esc).join(', ')} · ${p.members.length} member${p.members.length === 1 ? '' : 's'}</span>
    <div class="tabs" role="tablist" aria-label="Project">${tabs.map(([t, label]) =>
      `<button type="button" role="tab" id="tab-${t}" data-ptab="${t}" aria-selected="${ptab === t}" aria-controls="ptab-panel"
        tabindex="${ptab === t ? 0 : -1}">${label}</button>`).join('')}</div>
    <div role="tabpanel" id="ptab-panel" aria-labelledby="tab-${ptab}">
    ${ptab === 'models' ? modelsTab(p) : ptab === 'members' ? membersTab(p) : `<div class="cols"><div class="card"><h3>Budget</h3>
      <div><strong>${usd(p.spent)}</strong> <span class="muted">used of ${usd(p.budget)} · ${usd(left)} left</span></div>
      ${bar(p)}
      ${admin ? `<div class="row" style="margin-top:12px"><label for="budget" class="label">Budget $</label>
        <input id="budget" type="number" min="0" step="0.01" value="${p.budget}" style="width:140px" required>
        <button id="save-budget">Save</button><span id="budget-msg" class="error" role="alert"></span></div>`
        : `<button class="ghost" style="margin-top:12px" data-request="budget" data-project="${esc(p.id)}">Request budget increase</button>`}
    </div>

function bindProject(p) {
  // admin actions show their error next to the buttons instead of failing silently
  const on = (id, msg, fn) => { const el = document.getElementById(id); if (el) el.onclick = async () => {
    try { await fn(); } catch (err) { document.getElementById(msg).textContent = err.message; } }; };
  const tabs = [...document.querySelectorAll('[data-ptab]')];
  tabs.forEach((b, i) => {
    b.onclick = () => { ptab = b.dataset.ptab; render(); $('#tab-' + ptab).focus(); };
    b.onkeydown = e => {  // arrow keys move between tabs (WAI-ARIA tabs pattern)
      const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (next !== undefined) { e.preventDefault(); tabs[(next + tabs.length) % tabs.length].click(); }
    };
  });
  const members = (path, opts) => api(`/api/projects/${p.id}/members/${encodeURIComponent(path)}`, opts);
  // after a change the signed-in user may have lost access: refresh() then falls back to the home page
  const afterMembers = async () => { await refresh(); if (!projects.some(x => x.id === p.id)) { view = 'overview'; render(); } };
  const mf = $('#member-form');
  if (mf) {
    mf.onsubmit = async e => {
      e.preventDefault();
      try { await members(mf.username.value.trim().toLowerCase(), { method: 'PUT', body: JSON.stringify({ role: mf.role.value }) }); await afterMembers(); $('#member-form')?.username.focus(); }
      catch (err) { $('#member-msg').textContent = err.message; }
    };
  }
  document.querySelectorAll('[data-member]').forEach(s => s.onchange = async () => {
    const u = s.dataset.member;
    if (u === me.username && s.value === 'member' && me.role !== 'admin'
        && !confirm('Become a member? You will no longer manage this project.')) { s.value = 'owner'; return; }
    try { await members(u, { method: 'PUT', body: JSON.stringify({ role: s.value }) }); await afterMembers(); }
    catch (err) { s.value = s.value === 'owner' ? 'member' : 'owner'; $('#members-msg').textContent = err.message; }
  });
  document.querySelectorAll('[data-remove]').forEach(b => b.onclick = async () => {
    const u = b.dataset.remove, self = u === me.username;
    if (!confirm(self ? 'Leave this project? You lose access to it.' : `Remove ${u} from this project?`)) return;
    try { await members(u, { method: 'DELETE' }); await afterMembers(); }
    catch (err) { $('#members-msg').textContent = err.message; }
  });
  on('toggle-key', 'key-msg', () => { showKey = !showKey; render(); });
  on('save-budget', 'budget-msg', async () => {
    const value = $('#budget').value.trim();  // an empty field would otherwise be sent as 0
    if (value === '' || !(Number(value) >= 0)) throw new Error('Enter a budget of 0 or more');
    await api(`/api/projects/${p.id}/budget`, { method: 'PATCH', body: JSON.stringify({ budget: Number(value) }) });
    await refresh();
  });
  on('revoke', 'key-msg', async () => {
    if (confirm('Revoke this API key? Calls using it will fail immediately.')) {
      await api(`/api/projects/${p.id}/key/revoke`, { method: 'POST' }); await refresh();
    }
  });
  on('regen', 'key-msg', async () => {
    if (!p.api_key || confirm('Regenerate the key? The current one stops working.')) {
      await api(`/api/projects/${p.id}/key/regenerate`, { method: 'POST' }); await refresh();
    }
  });
  document.querySelectorAll('[data-model]').forEach(c => c.onchange = async () => {
    const picked = [...document.querySelectorAll('[data-model]:checked')].map(x => x.dataset.model);
    try { await api(`/api/projects/${p.id}/models`, { method: 'PUT', body: JSON.stringify({ models: picked }) }); refresh(); }
    catch (err) { c.checked = !c.checked; $('#models-msg').textContent = err.message; }
  });
  const keepOpen = fn => () => {
    const open = [...document.querySelectorAll('details[open] [data-try]')].map(b => b.dataset.try);
    fn(); render();
    document.querySelectorAll('[data-try]').forEach(b => { if (open.includes(b.dataset.try)) b.closest('details').open = true; });
  };
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = keepOpen(() => lang = b.dataset.lang));
  document.querySelectorAll('[data-kind]').forEach(b => b.onclick = keepOpen(() => apiKind = b.dataset.kind));
  document.querySelectorAll('[data-try]').forEach(b => b.onclick = async () => {
    const model = b.dataset.try, chat = apiKind === 'chat';
    let msg;
    if (!p.api_key) msg = '<span class="error">No active API key.</span>';
    else {
      b.disabled = true; b.textContent = 'Sending…';
      const r = await fetch(p.endpoint + (chat ? '/chat/completions' : '/responses'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + p.api_key },
        body: JSON.stringify(chat ? { model, messages: [{ role: 'user', content: 'Hello' }] } : { model, input: 'Hello' }),
      });
      const d = await r.json();
      const text = r.ok && (chat ? d.choices[0].message.content : d.output_text);
      await refresh();
      const now = projects.find(x => x.id === p.id);
      // cost as billed by LiteLLM, from the provider's usage block
      const cost = Number(r.headers.get('x-litellm-response-cost'));
      msg = r.ok ? `<span class="muted">${esc(text)} Cost ${cost ? usd(cost) : 'free'} · ${usd(Math.max(0, now.budget - now.spent))} left</span>`
                 : `<span class="error">${r.status} · ${esc(d.error.message)}</span>`;
    }
    const det = [...document.querySelectorAll('[data-try]')].find(x => x.dataset.try === model).closest('details');
    det.open = true;
    det.querySelector('.try-result').innerHTML = msg;
  });
}

// ---------- usage charts (plain SVG: no CDN in the air gap) ----------
// categorical slots in fixed order, validated for adjacent marks; color follows the entity, never its rank
const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
const CH = 260, CL = 56, CR = 8, CT = 10, CB = 28, PH = CH - CT - CB;
// draw at the width the card will have, so text stays 12px; the viewBox only rescales on window resize
const chartWidth = () => { const m = $("#main"), cs = getComputedStyle(m); return Math.max(320, m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 42); };
let usage, period = 30, metric = 'spend';
const charts = {};

async function loadUsage() { usage = { period, ...await api(`/api/usage?days=${period}`) }; }
const compact = n => n >= 1e6 ? +(n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? +(n / 1e3).toFixed(1) + 'K' : String(+n.toFixed(2));
const fmt = n => metric === 'spend' ? usd(n) : compact(n);
const tick = v => metric === 'spend' ? '$' + (v >= 1000 ? compact(v) : +v.toFixed(4)) : compact(v);
const day = (d, long) => new Date(d + 'T00:00:00Z').toLocaleDateString('en', { month: 'short', day: 'numeric', ...(long && { weekday: 'short' }), timeZone: 'UTC' });
const usageFilters = () => `${seg('period', String(period), [['7', '7 days'], ['30', '30 days'], ['90', '90 days']])}
  ${seg('metric', metric, [['spend', 'Spend'], ['tokens', 'Tokens']])}`;

// usage rows -> one series per entity (key(row) matches an [id, label] pair, fixed order); past 8, the tail folds into "Other"
function series(key, entities, keep = () => true) {
  const at = Object.fromEntries(usage.days.map((d, i) => [d, i])), fold = entities.length > 8;
  const list = (fold ? entities.slice(0, 7) : entities).map(([id, name], i) => ({ id, name, color: PALETTE[i], values: usage.days.map(() => 0) }));
  if (fold) list.push({ id: null, name: 'Other', color: '#898781', values: usage.days.map(() => 0) });
  for (const r of usage.rows) {
    if (!keep(r)) continue;
    const s = list.find(s => s.id === key(r)) || (fold && list.at(-1));
    if (s) s.values[at[r.date]] += r[metric];
  }
  return list.filter(s => s.values.some(v => v));
}

function niceScale(max) {
  if (!max) return { max: 1, step: 0.25 };
  const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  return { max: Math.ceil(max / step - 1e-9) * step, step };
}

const roundTop = (x, y, w, h, r) => (r = Math.min(r, w / 2, h),
  `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`);

// stacked daily columns: 2px surface gap between segments, 4px rounded top, square at the baseline
function chart(id, title, list) {
  if (!usage) return '<p class="muted">Loading…</p>';
  if (!list.length) return `<p class="muted" style="margin:0">No ${metric === 'spend' ? 'spend' : 'tokens'} in the last ${period} days.</p>`;
  const CW = chartWidth(), PW = CW - CL - CR;
  charts[id] = { list, CW };
  const n = usage.days.length, band = PW / n, bw = Math.min(24, Math.max(2, band - 2));
  const totals = usage.days.map((_, i) => list.reduce((a, s) => a + s.values[i], 0));
  const { max, step } = niceScale(Math.max(...totals)), y = v => v / max * PH;
  let grid = '', marks = '', labels = '';
  for (let k = 0; k * step <= max + 1e-9; k++) {
    const yy = CT + PH - y(k * step);
    grid += `<line x1="${CL}" x2="${CW - CR}" y1="${yy}" y2="${yy}" stroke="${k ? '#e1e0d9' : '#c3c2b7'}"/>
      <text x="${CL - 8}" y="${yy + 4}" text-anchor="end">${tick(k * step)}</text>`;
  }
  usage.days.forEach((_, i) => {
    const x = CL + i * band + (band - bw) / 2, segs = list.filter(s => s.values[i] > 0);
    let base = CT + PH;
    segs.forEach((s, k) => {
      const h = y(s.values[i]), hh = h - (k ? 2 : 0);
      if (hh > 0.5) marks += k === segs.length - 1 ? `<path d="${roundTop(x, base - h, bw, hh, 4)}" fill="${s.color}"/>`
                                                   : `<rect x="${x}" y="${base - h}" width="${bw}" height="${hh}" fill="${s.color}"/>`;
      base -= h;
    });
  });
  for (let i = n - 1; i >= 0; i -= Math.ceil(n / 6)) labels += `<text x="${CL + (i + 0.5) * band}" y="${CH - 8}" text-anchor="middle">${day(usage.days[i])}</text>`;
  const sum = s => s.values.reduce((a, v) => a + v, 0);
  const legend = list.length > 1 ? `<div class="legend">${list.map(s =>
    `<span><i class="sw" style="background:${s.color}"></i>${esc(s.name)}<b>${fmt(sum(s))}</b></span>`).join('')}</div>` : '';
  const rows = usage.days.map((d, i) => [d, i]).filter(([, i]) => totals[i]).reverse();
  return `<div class="chart"><svg viewBox="0 0 ${CW} ${CH}" role="img" tabindex="0" data-chart="${id}"
      aria-label="${esc(title)}: daily ${metric} over the last ${n} days. Use arrow keys for daily values, or open the table.">
      <rect class="hover" y="${CT}" height="${PH}" fill="#eff4ff" visibility="hidden"/>${grid}${marks}${labels}</svg>
      <div class="tip hidden" role="status"></div></div>${legend}
    <details class="tbl"><summary>Table</summary><div class="wrap"><table>
      <tr><th>Day</th>${list.map(s => `<th>${esc(s.name)}</th>`).join('')}${list.length > 1 ? '<th>Total</th>' : ''}</tr>
      ${rows.map(([d, i]) => `<tr><td>${day(d, true)}</td>${list.map(s => `<td>${fmt(s.values[i])}</td>`).join('')}${list.length > 1 ? `<td>${fmt(totals[i])}</td>` : ''}</tr>`).join('')}
    </table></div></details>`;
}

function bindCharts() {
  document.querySelectorAll('[data-period]').forEach(b => b.onclick = async () => { period = +b.dataset.period; await loadUsage(); render(); });
  document.querySelectorAll('[data-metric]').forEach(b => b.onclick = () => { metric = b.dataset.metric; render(); });
  document.querySelectorAll('svg[data-chart]').forEach(svg => {
    const { list, CW } = charts[svg.dataset.chart], n = usage.days.length, band = (CW - CL - CR) / n;
    const tip = svg.nextElementSibling, hover = svg.querySelector('.hover');
    let idx = n - 1;
    const show = i => {
      idx = Math.max(0, Math.min(n - 1, i));
      hover.setAttribute('x', CL + idx * band); hover.setAttribute('width', band); hover.setAttribute('visibility', 'visible');
      const total = list.reduce((a, s) => a + s.values[idx], 0);
      tip.innerHTML = `<div class="muted">${day(usage.days[idx], true)}</div>`
        + (list.length > 1 ? `<div class="r">Total<b>${fmt(total)}</b></div>` : `<div class="r">${esc(list[0].name)}<b>${fmt(total)}</b></div>`)
        + (list.length > 1 ? list.map(s => `<div class="r"><i class="key-line" style="background:${s.color}"></i>${esc(s.name)}<b>${fmt(s.values[idx])}</b></div>`).join('') : '');
      tip.classList.remove('hidden');
      const w = svg.getBoundingClientRect().width, x = (CL + (idx + 0.5) * band) / CW * w;
      tip.style.left = (x + 14 + tip.offsetWidth > w ? x - 14 - tip.offsetWidth : x + 14) + 'px';
    };
    const hide = () => { tip.classList.add('hidden'); hover.setAttribute('visibility', 'hidden'); };
    svg.onpointermove = e => { const b = svg.getBoundingClientRect(); show(Math.floor(((e.clientX - b.left) / b.width * CW - CL) / band)); };
    svg.onpointerleave = hide; svg.onblur = hide; svg.onfocus = () => show(idx);
    svg.onkeydown = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(idx + (e.key === 'ArrowRight' ? 1 : -1)); } };
  });
}

function usageView() {
  const total = k => usage.rows.reduce((a, r) => a + r[k], 0);
  return `<h2>Usage</h2>
    <p class="muted">Spend as billed by LiteLLM from provider token counts. On-prem models are free: switch to Tokens to see their load.</p>
    <div class="tools" style="margin-top:16px">${usageFilters()}</div>
    <div class="kpis"><div class="card kpi"><h3>Spend, last ${period} days</h3><div class="v">${usd(total('spend'))}</div></div>
      <div class="card kpi"><h3>Tokens, last ${period} days</h3><div class="v">${compact(total('tokens'))}</div></div></div>
    <div class="card"><h3>Overall</h3>${chart('overall', 'All projects', series(() => 'all', [['all', 'All projects']]))}</div>
    <div class="card"><h3>Per model</h3>${chart('models', 'Per model', series(r => r.model, models.map(m => [m.id, m.id])))}</div>
    <div class="card"><h3>Per project</h3>${chart('projects', 'Per project', series(r => r.project, projects.map(p => [p.id, p.name])))}</div>`;

function bindUsers() {
  const f = $('#user-form');

    e.preventDefault();

      issued = { ...await api('/api/users', { method: 'POST', body: JSON.stringify({ username: f.username.value, role: f.role.value }) }), isNew: true };
      await loadUsers(); render();
    } catch (err) { $('#user-msg').textContent = err.message; }
  };
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
    if (!confirm(`Reset the password of ${b.dataset.reset}? Their current password stops working and they are signed out.`)) return;
    try {
      issued = { ...await api(`/api/users/${encodeURIComponent(b.dataset.reset)}/reset-password`, { method: 'POST' }), isNew: false };
      await loadUsers(); render();
    } catch (err) { $('#users-msg').textContent = err.message; }
  });
  document.querySelectorAll('[data-role-of]').forEach(s => s.onchange = async () => {
    const name = s.dataset.roleOf, self = name === me.username;

      await loadUsers(); render();

}

  return `<h2>Change password</h2>
    <p class="muted">${me.must_change_password ? 'Your password was set by an admin. Choose your own to continue.' : 'Use at least 12 characters.'}</p>
    <form class="card" id="pw-form" style="max-width:460px"><div class="grid">
      <label for="pw-cur">Current</label><input id="pw-cur" name="current" type="password" autocomplete="current-password" required>
      <label for="pw-new">New</label><input id="pw-new" name="new" type="password" autocomplete="new-password" minlength="12" required>
      <label for="pw-rep">Repeat</label><input id="pw-rep" name="repeat" type="password" autocomplete="new-password" minlength="12" required>
    </div>
    <div class="row" style="margin:16px 0 0"><button>Save</button><span id="pw-msg" role="status"></span></div></form>`;
}

function bindPassword() {
  const f = $('#pw-form');
  f.current.focus();
  f.onsubmit = async e => {
    e.preventDefault();
    if (f.new.value !== f.repeat.value) return void ($('#pw-msg').innerHTML = '<span class="error">The two new passwords differ.</span>');
    try {
      await api('/api/me/password', { method: 'POST', body: JSON.stringify({ current: f.current.value, new: f.new.value }) });
      if (me.must_change_password) { view = 'overview'; return boot(); }
      f.reset(); $('#pw-msg').innerHTML = '<span class="muted">Password changed ✓</span>';
    } catch (err) { $('#pw-msg').innerHTML = `<span class="error">${esc(err.message)}</span>`; }
  };
}

// ---------- requests ----------
const projectName = id => projects.find(p => p.id === id)?.name || id;

function describe(r) {
  if (r.kind === 'project') return `New project <b>${esc(r.name)}</b> · ${usd(r.amount)} budget`;
  if (r.kind === 'budget') return `Budget +${usd(r.amount)} for <b>${esc(projectName(r.project))}</b>`;
  return `Model <b>${esc(r.name)}</b>${r.project ? ` for ${esc(projectName(r.project))}` : ''}`;
}

function requestsView() {
  const admin = me.role === 'admin';
  const list = admin ? [...requests].sort((a, b) => (a.status !== 'pending') - (b.status !== 'pending')) : requests;
  const pending = requests.filter(r => r.status === 'pending').length;
  return `<h2>Requests</h2>
    <p class="muted">${admin ? `${pending} pending. Approving a project or budget request applies it at once.`
      : 'Ask the platform admins for a new project, a budget increase or a new model.'}</p>
    ${admin ? '' : requestForm()}
    <div class="card"><h3>${admin ? 'All requests' : 'My requests'}</h3>
    ${list.length ? `<table><tr><th>Request</th>${admin ? '<th>From</th>' : ''}<th>Reason</th><th>Date</th><th>Status</th>${admin ? '<th></th>' : ''}</tr>
      ${list.map(r => `<tr><td>${describe(r)}</td>${admin ? `<td>${esc(r.by)}</td>` : ''}
        <td>${esc(r.reason)}</td><td class="muted" style="white-space:nowrap">${esc(r.created.slice(0, 10))}</td>
        <td><span class="pill ${esc(r.status)}">${esc(r.status)}</span>${r.note ? `<div class="muted">${esc(r.note)}</div>` : ''}</td>
        ${admin ? `<td>${r.status === 'pending' ? `<div class="tools"><input data-note="${r.id}" placeholder="Note (optional)" aria-label="Note">
          <button data-decide="approve" data-id="${r.id}">Approve</button>
          <button class="danger" data-decide="reject" data-id="${r.id}">Reject</button></div>` : ''}</td>` : ''}</tr>`).join('')}
    </table>` : '<p class="muted" style="margin:0">No requests yet.</p>'}</div>`;
}

function requestForm() {
  const k = reqDraft.kind;
  const projectSelect = any => `<label for="rq-project">Project</label><select id="rq-project" name="project">
    ${any ? '<option value="">Any project</option>' : ''}${projects.map(p =>
      `<option value="${esc(p.id)}" ${p.id === reqDraft.project ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`;
  return `<form class="card" id="req-form"><h3>New request</h3>
    <div style="margin-bottom:16px">${seg('rkind', k, [['project', 'New project'], ['budget', 'Budget increase'], ['model', 'New model']])}</div>
    <div class="grid">
      ${k === 'budget' ? projectSelect(false) : `<label for="rq-name">${k === 'model' ? 'Model' : 'Name'}</label>
        <input id="rq-name" name="name" required maxlength="200" ${k === 'model' ? 'placeholder="Model name and platform"' : ''}>`}
      ${k === 'model' ? projectSelect(true) : `<label for="rq-amount">${k === 'budget' ? 'Add $' : 'Budget $'}</label>
        <input id="rq-amount" name="amount" type="number" min="0.01" step="0.01" required style="width:140px"
          value="${k === 'project' ? cfg.default_budget : ''}">`}
      <label for="rq-reason">Reason</label><textarea id="rq-reason" name="reason" rows="2" maxlength="2000"></textarea>
    </div>
    <div class="row" style="margin:16px 0 0"><button>Send request</button><span id="req-msg" role="status"></span></div>
  </form>`;
}

function bindRequests() {
  document.querySelectorAll('[data-rkind]').forEach(b => b.onclick = () => { reqDraft = { ...reqDraft, kind: b.dataset.rkind }; render(); });
  const f = $('#req-form');
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(f);
    try {
      await api('/api/requests', { method: 'POST', body: JSON.stringify({ kind: reqDraft.kind, name: fd.get('name') || '',
        project: fd.get('project') || '', amount: Number(fd.get('amount') || 0), reason: fd.get('reason') }) });
      await loadInbox(); render();
      $('#req-msg').innerHTML = '<span class="muted">Request sent ✓ An admin will review it.</span>';
    } catch (err) { $('#req-msg').innerHTML = `<span class="error">${esc(err.message)}</span>`; }
  };
  document.querySelectorAll('[data-decide]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      await api(`/api/requests/${b.dataset.id}/${b.dataset.decide}`, { method: 'POST',
        body: JSON.stringify({ note: document.querySelector(`[data-note="${b.dataset.id}"]`).value }) });
      [projects] = await Promise.all([api('/api/projects'), loadInbox()]);  // approvals can add projects or budget
      render();
    } catch (err) { b.disabled = false; alert(err.message); }
  });
}

// ---------- feedback ----------
function feedbackView() {
  const admin = me.role === 'admin';
  return `<h2>Feedback</h2>
    <p class="muted">${admin ? 'What users told the platform team.' : 'Tell the platform team what works, what does not, and what you miss.'}</p>
    ${admin ? '' : `<form class="card" id="fb-form">
      <textarea name="message" rows="4" maxlength="2000" required aria-label="Your feedback" placeholder="Your feedback"></textarea>
      <div class="row" style="margin:12px 0 0"><button>Send feedback</button><span id="fb-msg" role="status"></span></div></form>`}
    <div class="card"><h3>${admin ? 'All feedback' : 'Sent by you'}</h3>
      ${feedback.length ? feedback.map(f => `<div class="fb"><div class="muted">${admin ? esc(f.by) + ' · ' : ''}${esc(f.created.slice(0, 10))}</div>${esc(f.message)}</div>`).join('')
        : '<p class="muted" style="margin:0">Nothing yet.</p>'}</div>`;
}

function bindFeedback() {
  const f = $('#fb-form');
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    try {
      await api('/api/feedback', { method: 'POST', body: JSON.stringify({ message: f.message.value }) });
      await loadInbox(); render();
      $('#fb-msg').innerHTML = '<span class="muted">Thanks, sent ✓</span>';
    } catch (err) { $('#fb-msg').innerHTML = `<span class="error">${esc(err.message)}</span>`; }
  };
}

// ---------- docs ----------
function docsView() {
  const ep = projects[0]?.endpoint || location.origin + '/v1';
  return `<div class="docs"><h2>Documentation</h2>
    <p class="muted">How to call LLMs from the air-gapped network through the gateway.</p>

    <h4>How it works</h4>
    <p>Your app calls one endpoint, served by LiteLLM on the gateway VM. Each request first goes through the guardrail
    endpoint (secrets, blocklists, personal data), then LiteLLM routes it to an on-prem model or to Amazon Bedrock
    in <code>${esc(cfg.bedrock_region)}</code> (in-region models, data stays in that region).
    This is the only way out of the air-gapped network.</p>

    <h4>Get access</h4>
    <ol><li>Ask an admin for an account. You get a temporary password and choose your own at first sign-in
        (<b>Change password</b> at the bottom of the sidebar works any time).</li>
      <li>Request a project on the <b>Requests</b> page, or ask an admin to add you as a member of an existing one.</li>
      <li>Open the project in the sidebar and copy its endpoint and API key.</li>
      <li>Store the key in an environment variable, for example <code>GATEWAY_API_KEY</code>. Never commit it.</li></ol>

    <h4>Call a model</h4>
    <p>The API is OpenAI-compatible: any OpenAI SDK or tool works by changing its base URL. Use the model names listed in your project.</p>
    <p><b>Chat Completions</b> (<code>/v1/chat/completions</code>), supported by almost every tool:</p>
    <pre>${esc(sample(ep, 'claude-sonnet-5-5', 'chat', 'curl'))}</pre>
    <p><b>Responses</b> (<code>/v1/responses</code>), the newer OpenAI format used by recent SDKs and agents:</p>
    <pre>${esc(sample(ep, 'claude-sonnet-5-5', 'responses', 'curl'))}</pre>
    <p>Both formats work with every model and are charged to the same project budget.
    LiteLLM also accepts Anthropic-format requests on <code>/v1/messages</code>, for tools that use the Anthropic SDK.</p>

    <h4>Budgets</h4>
    <p>Each project has a budget in USD. Every call is charged with the token counts reported by the model provider,
    at the prices shown on the project page. Cached input tokens (prompt caching on Bedrock) are charged at the lower cached price.
    The cost of each call is returned in the <code>x-litellm-response-cost</code> response header.
    On-prem models are free and never use budget.
    The <b>Usage per model</b> chart on the project page shows daily spend or tokens per model over 7, 30 or 90 days.</p>
    <p>When the budget is spent, all calls of the project are rejected, on-prem ones included, until an admin raises it.
    The check runs before each call, so the last call can go slightly over budget.
    Only admins change budgets: use <b>Request budget increase</b> on the project page.</p>

    <h4>Project members</h4>
    <p>A project page has three tabs: <b>Overview</b> (budget, endpoint, API key, usage), <b>Models</b> (sample requests) and
    <b>Members</b>. A project has one or more owners and any number of members; all of them can use the project's API key.
    Owners add members by username, remove them and switch them between owner and member. A project always keeps one owner.</p>

    <h4>Requests and feedback</h4>
    <p>The <b>Requests</b> page lets you ask for a new project, a budget increase or a new model, and shows their status
    and the admin's note. Use <b>Feedback</b> for anything else you want the platform team to know.</p>

    <h4>Errors</h4>
    <table><tr><th>Status</th><th>Code</th><th>Meaning</th></tr>
      <tr><td>401</td><td><code>invalid_api_key</code></td><td>Key is wrong or was revoked. Get the current key from the project page.</td></tr>
      <tr><td>401</td><td><code>team_model_access_denied</code></td><td>The model is not enabled for your project. Ask an admin to add it.</td></tr>
      <tr><td>400</td><td><code>budget_exceeded</code></td><td>The project budget is spent. Ask an admin to raise it.</td></tr>
      <tr><td>400</td><td><code>invalid_request_error</code></td><td>For example a model name that is not in your project's list.</td></tr></table>

    ${me.role === 'admin' ? `<h4>For admins</h4>
    <ul><li><b>New project</b> on the Overview page creates a project with its owner, members, budget and first API key. Admins can manage the members of every project.</li>
      <li>On a project page you can change the budget, revoke the key (calls fail at once) or regenerate it (the old key stops working).</li>
      <li>Under <b>Models this project can call</b>, tick or untick a model to add or remove it. It applies at once; a project keeps at least one model.
        New projects start with every model.</li>
      <li><b>Requests</b> shows pending requests first, with a count in the sidebar. Approving a project request creates it with the
        requester as owner; approving a budget request adds the amount to the budget. A model request is only recorded:
        add the model to LiteLLM's config yourself.</li>
      <li><b>Feedback</b> lists everything users sent.</li>
      <li><b>Users</b>: add an account (user or admin) and send the generated temporary password with <b>Copy message for the user</b>;
        it is shown once and the user must change it at first sign-in. <b>Reset password</b> issues a new one and signs the user out.
        The role list switches anyone between user and admin; at least one admin always remains.
        An admin can also use <b>Sign in as user</b> to see only their own projects.</li>
      <li><b>Usage</b> shows daily spend or tokens overall, per model and per project. Tokens is the view for on-prem load,
        since on-prem models cost nothing.</li></ul>` : ''}
  </div>`;
}

boot();
</script>
</body>
</html>
